<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thrift Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">

  <!-- Navbar -->
  <nav class="flex justify-between items-center p-4 bg-gray-800 shadow-lg">
    <h1 class="text-2xl font-bold">Thrift Store</h1>
    <div class="space-x-4">
      <a href="#" class="hover:text-gray-400">Home</a>
      <a href="#products" class="hover:text-gray-400">Products</a>
      <a href="#contact" class="hover:text-gray-400">Contact</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="text-center py-16">
    <h2 class="text-4xl font-bold mb-4">Vintage & Trendy Fits</h2>
    <p class="text-gray-400">Best thrift collection at affordable prices</p>
    <button class="mt-6 px-6 py-2 bg-white text-black rounded-xl">Shop Now</button>
  </section>

  <!-- Products Section -->
  <section id="products" class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-gray-800 p-4 rounded-2xl shadow-lg">
      <img src="https://via.placeholder.com/300" class="rounded-xl mb-3" />
      <h3 class="text-xl">Vintage Hoodie</h3>
      <p class="text-gray-400">₹799</p>
      <button class="mt-2 px-4 py-1 bg-white text-black rounded-lg">Buy</button>
    </div>

    <div class="bg-gray-800 p-4 rounded-2xl shadow-lg">
      <img src="https://via.placeholder.com/300" class="rounded-xl mb-3" />
      <h3 class="text-xl">Oversized T-Shirt</h3>
      <p class="text-gray-400">₹499</p>
      <button class="mt-2 px-4 py-1 bg-white text-black rounded-lg">Buy</button>
    </div>

    <div class="bg-gray-800 p-4 rounded-2xl shadow-lg">
      <img src="https://via.placeholder.com/300" class="rounded-xl mb-3" />
      <h3 class="text-xl">Baggy Jeans</h3>
      <p class="text-gray-400">₹999</p>
      <button class="mt-2 px-4 py-1 bg-white text-black rounded-lg">Buy</button>
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="p-6 text-center">
    <h2 class="text-2xl font-bold mb-2">Contact Us</h2>
    <p class="text-gray-400">DM us on Instagram: @yourstore</p>
  </section>

</body>
</html>
